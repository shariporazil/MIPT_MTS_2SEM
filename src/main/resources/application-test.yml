server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:mem:todo_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

logging:
  level:
    com.mipt.sharipovrazil: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: DEBUG

app:
  name: "To-Do List Manager TEST"
  version: "1.0.0-TEST"
  api:
    version: "2.0.0"
  upload:
    dir: target/test-uploads
  cors:
    allowed-origin: "http://localhost:3000"