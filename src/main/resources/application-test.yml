external-api:
  base-url: http://localhost:18080/external/v1
  connect-timeout-ms: 500
  read-timeout-ms: 700

resilience4j:
  circuitbreaker:
    instances:
      externalService:
        sliding-window-type: count_based
        sliding-window-size: 3
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 1
        wait-duration-in-open-state: 1s
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - com.mipt.sharipovrazil.exception.ExternalTaskNotFoundException
  ratelimiter:
    instances:
      externalService:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0

logging:
  level:
    com.mipt.sharipovrazil: DEBUG