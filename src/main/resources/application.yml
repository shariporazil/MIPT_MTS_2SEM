server:
  port: 8080

spring:
  application:
    name: sharipovrazil
  profiles:
    active: dev

jwt:
  secret: ${JWT_SECRET:my-secret-key-for-hw4-gateway-2024}
  expiration-minutes: 60

security:
  password-pepper: ${PASSWORD_PEPPER:secure-pepper-2024}

external-api:
  base-url: http://localhost:${server.port:8080}/external/v1
  connect-timeout-ms: 1000
  read-timeout-ms: 1500
  user-agent: hw4-gateway/1.0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,circuitbreakers,ratelimiters
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      externalService:
        sliding-window-type: count_based
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 2
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - com.mipt.sharipovrazil.exception.ExternalTaskNotFoundException
  ratelimiter:
    instances:
      externalService:
        limit-for-period: 5
        limit-refresh-period: 10s
        timeout-duration: 0
  retry:
    instances:
      externalService:
        max-attempts: 2
        wait-duration: 200ms
  timelimiter:
    instances:
      externalService:
        timeout-duration: 2s

logging:
  level:
    com.mipt.sharipovrazil: DEBUG
    org.springframework.web: INFO